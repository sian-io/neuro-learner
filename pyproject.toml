[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-learner"
version = "0.1.0"
description = "Metacognitive Agent for Active Learning, Metacognition, and Long-Term Mnemonic Retention"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.7.0",
    "fsrs>=3.0.0",
    "google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
